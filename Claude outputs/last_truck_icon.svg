<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a3a"/>
      <stop offset="0.55" stop-color="#3a2a5c"/>
      <stop offset="0.8" stop-color="#c2553a"/>
      <stop offset="1" stop-color="#f0a040"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe680" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1024" height="1024" rx="210"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- 하늘 -->
    <rect width="1024" height="1024" fill="url(#sky)"/>

    <!-- 달 -->
    <circle cx="760" cy="250" r="190" fill="url(#moonGlow)"/>
    <polygon points="760,160 838,205 850,290 790,345 705,335 668,262 700,190" fill="#ffe9a8"/>
    <polygon points="760,160 838,205 790,240 720,215" fill="#fff6d2"/>
    <polygon points="790,345 705,335 740,300" fill="#f2d283"/>

    <!-- 별 -->
    <g fill="#ffffff">
      <circle cx="180" cy="170" r="6"/><circle cx="300" cy="110" r="4"/>
      <circle cx="420" cy="210" r="5"/><circle cx="130" cy="300" r="3.5"/>
      <circle cx="560" cy="130" r="3.5"/><circle cx="910" cy="420" r="4"/>
    </g>

    <!-- 먼 산 (로우폴리) -->
    <polygon points="0,640 140,520 260,600 380,500 520,610 640,540 780,620 900,530 1024,600 1024,760 0,760" fill="#2a1f45"/>
    <polygon points="140,520 200,600 260,600" fill="#3a2b5e"/>
    <polygon points="380,500 440,590 520,610" fill="#3a2b5e"/>
    <polygon points="900,530 950,590 1024,600" fill="#3a2b5e"/>

    <!-- 헤드라이트 빛 -->
    <polygon points="808,628 1024,560 1024,760" fill="url(#beam)"/>

    <!-- 땅 (로우폴리) -->
    <polygon points="0,760 220,720 480,750 760,715 1024,745 1024,1024 0,1024" fill="#1b1430"/>
    <polygon points="0,760 220,720 160,840" fill="#251b3f"/>
    <polygon points="480,750 760,715 640,860" fill="#251b3f"/>
    <polygon points="760,715 1024,745 900,880" fill="#2c2148"/>

    <!-- 어둠 속 몬스터 눈 -->
    <g fill="#ff3b3b">
      <ellipse cx="92" cy="690" rx="11" ry="6"/><ellipse cx="128" cy="688" rx="11" ry="6"/>
      <ellipse cx="150" cy="625" rx="8" ry="4.5"/><ellipse cx="176" cy="624" rx="8" ry="4.5"/>
    </g>

    <!-- 트럭 -->
    <g>
      <!-- 그림자 -->
      <ellipse cx="530" cy="800" rx="330" ry="26" fill="#000" opacity="0.35"/>
      <!-- 짐칸 -->
      <polygon points="230,500 600,500 610,520 610,740 230,740" fill="#c9442e"/>
      <polygon points="230,500 600,500 610,520 240,520" fill="#e2603f"/>
      <polygon points="230,620 610,620 610,740 230,740" fill="#a5361f"/>
      <rect x="230" y="740" width="380" height="18" fill="#3a2d36"/>
      <!-- 짐칸 줄무늬/짐 -->
      <rect x="270" y="545" width="300" height="14" rx="4" fill="#f2b84b"/>
      <rect x="270" y="580" width="300" height="10" rx="4" fill="#a5361f" opacity="0.6"/>
      <!-- 운전석 -->
      <polygon points="620,560 730,560 800,640 812,640 812,740 620,740" fill="#e9e1d0"/>
      <polygon points="620,560 730,560 742,575 620,575" fill="#ffffff"/>
      <!-- 창문 -->
      <polygon points="645,582 722,582 782,650 645,650" fill="#5ec8e8"/>
      <polygon points="645,582 700,582 660,650 645,650" fill="#a8ecff"/>
      <!-- 운전석 하단 -->
      <polygon points="620,690 812,690 812,740 620,740" fill="#c8bfab"/>
      <!-- 범퍼/라이트 -->
      <rect x="800" y="704" width="30" height="40" rx="6" fill="#4a3d48"/>
      <rect x="806" y="652" width="18" height="30" rx="5" fill="#ffe680"/>
      <!-- 바퀴 -->
      <g>
        <circle cx="330" cy="760" r="62" fill="#22202a"/>
        <circle cx="330" cy="760" r="28" fill="#8a8695"/>
        <circle cx="470" cy="760" r="62" fill="#22202a"/>
        <circle cx="470" cy="760" r="28" fill="#8a8695"/>
        <circle cx="710" cy="760" r="62" fill="#22202a"/>
        <circle cx="710" cy="760" r="28" fill="#8a8695"/>
      </g>
      <!-- 곡괭이 (짐칸 위) -->
      <g transform="rotate(-18 420 470)">
        <rect x="410" y="400" width="18" height="120" rx="6" fill="#8b5a2b"/>
        <path d="M340,412 Q419,360 498,412 L490,428 Q419,388 348,428 Z" fill="#b8c0cc"/>
